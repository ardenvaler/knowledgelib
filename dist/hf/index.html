<style>
:root, html[data-mode="light"] { color-scheme: light; --bg: #f6f4ee; --dots: rgba(62,54,128,.085); --surface: #fff; --ink: #191a33; --muted: #5a5d79; --faint: #8a8da6; --line: #e7e4ec; --line-2: #d4d1dd; --accent: #4f46e5; --accent-soft: #ecebff; --pink: #ff5f9e; --amber: #f5a623; --sky: #2f95f0; --bad: #d03b3b; --shadow: 0 2px 6px rgba(25,26,51,.08), 0 30px 60px -24px rgba(25,26,51,.38); }

<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var LEN = 6, KEY = 'kl:k:' + P.kid, root = document.documentElement;
  var form = document.getElementById('f'), pin = document.getElementById('pin'), msg = document.getElementById('msg');
  var go = document.getElementById('go'), card = document.getElementById('card');
  var cells = [].slice.call(document.querySelectorAll('.cells i'));
  var ok = !!(window.crypto && crypto.subtle && window.TextEncoder && window.DecompressionStream && window.Response && Blob.prototype.stream);

  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function ub64(u) { var s = ''; for (var i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }

      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.ct)); })
      .then(function (buf) { return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  function reveal() { root.className = ''; try { pin.focus({ preventScroll: true }); } catch (e) { /* ignore */ } paint(); }
  function paint() {
    var v = pin.value;
    cells.forEach(function (c, i) { c.classList.toggle('on', i < v.length); c.classList.toggle('cur', i === Math.min(v.length, LEN - 1) && document.activeElement === pin); });
  }

  if (!ok) { root.className = ''; msg.textContent = 'This browser can’t decrypt the page.'; pin.disabled = go.disabled = true; return; }

  pin.addEventListener('blur', paint);
