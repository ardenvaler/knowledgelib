# Arden's Knowledge Library
#
# dist/ is built locally with tools/build.mjs, which needs the PIN and the readable dashboards.
# Neither ever enters this public repository, and dist/ holds only ciphertext, so Netlify
# publishes it as is. The build step only checks that the encrypted page is there.
[build]
  publish = "dist"
  command = "test -s dist/index.html && test -s dist/robots.txt"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
