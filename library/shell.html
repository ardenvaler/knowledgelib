<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f4ee">
<title>Arden’s Knowledge Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='4.6' height='19' rx='1.4' fill='%23D97524'/%3E%3Crect x='8.6' y='5' width='4.6' height='22' rx='1.4' fill='%23E0AC00'/%3E%3Crect x='14.2' y='9' width='4.6' height='18' rx='1.4' fill='%232A57C4'/%3E%3Crect x='19.8' y='6' width='4.6' height='21' rx='1.4' fill='%235B5CE6'/%3E%3Crect x='25.4' y='10' width='4.6' height='17' rx='1.4' fill='%230B7A5E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{FONTS}}">
<script>(function(){var m=null;try{m=JSON.parse(localStorage.getItem('kl.mode'))}catch(e){}if(m!=='light'&&m!=='dark')m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.mode=m})()</script>
<style>/*{{CSS}}*/</style>
</head>
<body>
<a class="skip" href="#shelf">Skip to the shelf</a>

<header class="nav" id="nav">
  <div class="nav-in">
    <a class="brand" href="/" data-home aria-label="Arden’s Knowledge Library, home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="8" width="4.6" height="19" rx="1.4" fill="#D97524"/><rect x="8.6" y="5" width="4.6" height="22" rx="1.4" fill="#E0AC00"/><rect x="14.2" y="9" width="4.6" height="18" rx="1.4" fill="#2A57C4"/><rect x="19.8" y="6" width="4.6" height="21" rx="1.4" fill="#5B5CE6"/><rect class="lean" x="25.4" y="10" width="4.6" height="17" rx="1.4" fill="#0B7A5E"/><rect x="1.5" y="27.4" width="29" height="2.2" rx="1.1" fill="currentColor" opacity=".5"/></svg>
      <span><span class="b-a">Arden’s</span> Knowledge Library</span>
    </a>
    <div class="search" id="search" role="search">
      <svg class="s-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search the library" autocomplete="off" spellcheck="false" aria-label="Search the library" aria-controls="results" aria-expanded="false" role="combobox" aria-autocomplete="list">
      <kbd class="s-key">/</kbd>
      <div class="results" id="results" role="listbox" hidden></div>
    </div>
    <div class="nav-actions">
      <div class="mode" role="group" aria-label="Theme">
        <button type="button" class="mode-btn" data-mode="light" aria-label="Day" data-tip="Day"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
        <button type="button" class="mode-btn" data-mode="dark" aria-label="Night" data-tip="Night"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg></button>
      </div>
      <button type="button" class="icon-btn" data-lock aria-label="Lock the library" data-tip="Lock the library"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg></button>
    </div>
  </div>
</header>

<main id="landing">
  <div class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-main" id="hero"></div>
      <aside class="glance" id="glance" aria-label="What’s on the shelf"></aside>
    </section>

    <section class="shelf-sec" id="shelf" aria-labelledby="shelf-title">
      <div class="sec-head">
        <h2 id="shelf-title">The shelf</h2>
        <p id="shelf-sub"></p>
      </div>
      <div class="shelf" id="shelf-grid"></div>
    </section>

    <section class="tm-sec" id="time" aria-labelledby="tm-title"></section>

    <section class="toc-sec" id="contents" aria-labelledby="toc-title">
      <div class="sec-head">
        <h2 id="toc-title">Contents</h2>
        <p>Every section of every dashboard, one click deep.</p>
      </div>
      <div class="toc" id="toc"></div>
    </section>
  </div>
  <footer class="foot" id="foot"></footer>
</main>

<div class="tip" id="tip" role="tooltip"></div>

<script id="kl-data" type="application/json">{{DATA}}</script>
<script>/*{{JS}}*/</script>
</body>
</html>
